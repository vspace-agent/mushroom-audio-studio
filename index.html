<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8e6df">
  <title>Mushroom Audio Studio</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="studio">
    <header>
      <p class="eyebrow">MUSHROOM HOUSE 🍄 STUDIO</p>
      <h1>Audio Studio</h1>
      <p class="intro">A little workshop for sound and music.</p>
    </header>

    <section class="workspace" aria-labelledby="converter-title">
      <p class="section-label">TOOL 01 / AUDIO EXTRACTION</p>
      <h2 id="converter-title">YouTube → Audio</h2>
      <p class="description">Convert videos you have permission to use into audio files.</p>

      <form id="converter-form">
        <label for="video-url">Video URL</label>
        <input id="video-url" type="url"
               placeholder="https://www.youtube.com/watch?v=..."
               autocomplete="off" required>

        <label for="audio-format">Audio format</label>
        <select id="audio-format">
          <option value="mp3">MP3</option>
          <option value="m4a">M4A</option>
        </select>

        <div id="cloud-access" hidden>
          <label for="cloud-passcode">Studio passcode</label>
          <input id="cloud-passcode" type="password"
                 autocomplete="off" placeholder="Enter your passcode">
        </div>

        <button id="convert-button" type="submit" disabled>
          Convert audio
        </button>
      </form>

      <p id="status" role="status" aria-live="polite">
        Converter connection pending.
      </p>
    </section>

    <footer>More little sound tools will join this workshop.</footer>
  </main>
</body>
</html>
